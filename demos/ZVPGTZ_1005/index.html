<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diák űrlap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        form {
            width: 400px;
            margin: 30px auto;
        }

        .mezo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
        }

        .hiba {
            color: red;
            font-size: 14px;
            margin-top: 4px;
        }

        .hibas {
            border: 2px solid red;
        }

        button {
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form id="diakForm">

        <div class="mezo">
            <label for="nev">Név:</label>
            <input type="text" id="nev">
            <div id="nevHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="lakcim">Lakcím:</label>
            <input type="text" id="lakcim">
            <div id="lakcimHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="kor">Kor:</label>
            <input type="text" id="kor">
            <div id="korHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="anyja">Anyja neve:</label>
            <input type="text" id="anyja">
            <div id="anyjaHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="egyetem">Egyetem neve:</label>
            <input type="text" id="egyetem">
            <div id="egyetemHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="kar">Kar neve:</label>
            <input type="text" id="kar">
            <div id="karHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="szak">Szak neve:</label>
            <input type="text" id="szak">
            <div id="szakHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <label for="diak">Diákigazolvány szám:</label>
            <input type="text" id="diak">
            <div id="diakHiba" class="hiba"></div>
        </div>

        <div class="mezo">
            <input type="checkbox" id="adatkezeles">
            <label for="adatkezeles">
                Elfogadom az adatkezelési szabályzatot.
            </label>
            <div id="adatkezelesHiba" class="hiba"></div>
        </div>

        <button type="submit">Küldés</button>

    </form>

    <script src="app.js"></script>

</body>

</html>
